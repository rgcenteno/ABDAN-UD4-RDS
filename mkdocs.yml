site_name: "Manual básico de supervisión"
theme:
  name: material
  locale: "es"
  features:
    - navigation.expand
  user_color_mode_toggle: true
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Cambiar a modo oscuro
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo light
nav:
    - Creación de sistema RDS:
        - Configuración inicial, credenciales: "Crear-RDS-01.md"
        - Capacidad de cómputo, almacenamiento y alta disponibilidad: "Crear-RDS-02.md"
        - Redes, conectividad y seguridad de acceso: "Crear-RDS-03.md"
        - Monitorización, copias de seguridad, mantenimiento y protección de los datos: "Crear-RDS-04.md"
