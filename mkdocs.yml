site_name: "Amazon RDS"

theme:
  name: material
  locale: es

  features:
    - navigation.expand
    - content.code.copy
    - content.code.annotate

  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:

  - admonition
  - attr_list
  - md_in_html

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.superfences

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - toc:
      permalink: true

nav:
  - Inicio: "index.md"

  - Amazon RDS y Aurora:
      - Visión general de Amazon RDS: "RDS-Introduccion.md"
      - Elección de la región y residencia de los datos: "BD-Region.md"
      - Creación de sistema RDS:
          - Configuración inicial, credenciales: "Crear-RDS-01.md"
          - Capacidad de cómputo, almacenamiento y alta disponibilidad: "Crear-RDS-02.md"
          - Redes, conectividad y seguridad de acceso: "Crear-RDS-03.md"
          - Monitorización, copias de seguridad, mantenimiento y protección de los datos: "Crear-RDS-04.md"
      - Securización y control de acceso: "RDS-Seguridad.md"
      - RDS Proxy: "RDS-Proxy.md"
      - Amazon Aurora:
          - Arquitectura: "Aurora-01.md"
          - Aurora MySQL y Aurora PostgreSQL: "Aurora-02.md"
          - Opciones de despliegue y escalado: "Aurora-03.md"

  - Amazon DynamoDB:
      - Introducción y modelo clave-valor: "DynamoDB-01.md"
      - Características: "DynamoDB-02.md"
      - Arquitectura: "DynamoDB-03.md"
      - Clave primaria, clave de ordenación y tipos de atributos: "DynamoDB-04.md"
      - Acceso y securización: "DynamoDB-05.md"

  - Administración de bases de datos:
      - Infraestructura como código: "BD-IaC.md"
      - Replicación y recuperación ante desastres: "BD-Replicacion.md"
      - "Ciclo de vida: modificaciones, copias y recuperación": "BD-CicloVida.md"
      - Monitorización del rendimiento y optimización: "BD-Rendimiento.md"
      - "Anexo: referencia de métricas de RDS": "Supervision-RDS.md"

  - Chuleta de comandos: "Chuleta.md"

  - Prácticas:
      - DynamoDB: "Practica-DynamoDB.md"
      - Solución: "Practica-DynamoDB-solucion.md"
      - "[EVALUABLE] Servidor Web + MySQL + DynamoDB": "practica-rds-dynamodb-sesiones.md"
